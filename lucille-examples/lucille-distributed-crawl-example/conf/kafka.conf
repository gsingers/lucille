# The same crawl, with each role in its own process, talking through Kafka.
include "crawl.conf"

kafka {
  bootstrapServers: "localhost:9092"
  bootstrapServers: ${?KAFKA_BOOTSTRAP_SERVERS}
  consumerGroupId: "crawl_example_workers"
  maxPollIntervalSecs: 600
  maxRequestSize: 10000000
}

crawl {
  workTopic: "crawl_example_work"
  controlTopic: "crawl_example_control"
  # must differ from kafka.consumerGroupId
  consumerGroupId: "crawl_example_crawlers"
  # two Crawler processes of two threads each
  workTopicPartitions: 4
}
