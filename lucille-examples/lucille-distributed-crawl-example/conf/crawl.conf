# A distributed crawl of a local directory tree, with the example DirectoryTreeConnector.
#
# Shared by every role. The in-process demo (scripts/run-in-process.sh) uses it as is; the Kafka run
# (scripts/run-kafka.sh) adds kafka.conf on top.

connectors: [
  {
    name: "tree"
    class: "com.kmwllc.lucille.example.crawl.DirectoryTreeConnector"
    pipeline: "crawl_pipeline"
    # the directory to crawl; scripts/make-sample-tree.sh writes a small one here
    root: "target/sample-tree"
    root: ${?CRAWL_ROOT}
    partitioning {
      # A unit lists this many directories, then hands the rest back to the Coordinator, which makes units of them.
      # Small here so that a small tree is visibly shared out; a real source wants a unit to take seconds.
      maxDirectoriesPerUnit: 10
    }
  }
]

pipelines: [
  {
    name: "crawl_pipeline"
    stages: [
      # a real pipeline would extract text, enrich, embed; this one only shows that Documents go through it
      { class: "com.kmwllc.lucille.stage.SetStaticValues", staticValues { crawled_by: "lucille-distributed-crawl-example" } }
    ]
  }
]

# Every Document lands in one CSV file, so a run is easy to check: one row per file in the tree.
indexer {
  type: "CSV"
  batchSize: 100
  batchTimeout: 500
}
csv {
  path: "target/crawl-output.csv"
  columns: ["id", "file_path", "file_size_bytes", "crawled_by"]
  includeHeader: true
}

crawl {
  # One unit is in flight per partition. Match the total Crawler threads.
  workTopicPartitions: 4
  # Units each Crawler process executes at once.
  threads: 2
  heartbeatSecs: 2
  orphanTimeoutSecs: 20
}

worker { threads: 2 }
